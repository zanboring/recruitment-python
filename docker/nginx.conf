server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ---------------------------------------------------- gzip
    # 为什么需要：前端产物里有 1MB 级 chunk（Element Plus + ECharts），
    # 不压缩时每次访问都全量传输。
    #
    # ⚠️ 必须显式列出 JS 的 MIME：nginx 的默认 gzip_types 只有 text/html，
    #    而现代 nginx 不会因为 typing 到 text/javascript 就自动压缩 ——
    #    漏掉 application/javascript 时，最大的那几个 chunk 恰好不被压缩。
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/rss+xml
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2;

    # ---------------------------------------------------- 静态产物缓存
    # Vite 构建产物的文件名自带内容 hash（index-<hash>.js / .css）：
    # 内容变则文件名变，因此可以安全地长缓存（immutable）。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # index.html 反而**不能**缓存：它引用带 hash 的产物文件名，
    # 一旦被浏览器缓存住，发新版后用户会一直拿到旧 index →
    # 引用已不存在的旧 chunk（表现为白屏，且刷新无效）。
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA 路由回退（内部重定向到 /index.html 会命中上面的精确匹配）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代到后端容器
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # SSE（text/event-stream）需要关闭缓冲才能实时推送
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
