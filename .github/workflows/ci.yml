name: CI

on:
  push:
    # 只列镜像库真会收到的三条分支。
    # 曾写过 'dev-merge/**'，想"隔离合并分支也过门禁" —— 但那是**不可能触发的**：
    # 本工作流跑在 GitHub 私有镜像库，而镜像脚本（push-ci-mirror.sh）只送
    # main / uat / dev，dev-merge/* 只存在于 Gitee。留着它等于在配置里写一句
    # "合并分支有 CI 兜着"，实际没有 —— 假判据的典型形态。
    # dev-merge/* 的验证责任在集成端的固定 SHA 复现（AGENTS.md §4.7 第三层），
    # 工具：bash D:/Dev/_backup/verify-sha.sh <sha> <期望通过数>。
    # 若将来真要给合并分支加 CI，先让镜像脚本支持 dev-merge/* 与失效分支清理，
    # 再把这里加回来 —— 顺序不能反。
    branches: [main, uat, dev]
  pull_request:
    branches: [main, uat, dev]
  workflow_dispatch:

jobs:
  test:
    name: 测试（Python 3.11）
    runs-on: ubuntu-latest

    env:
      # CI 里没有 Redis / Ollama / 浏览器。四项后端显式用进程内实现，
      # 与「不配置 Redis 时项目必须与改造前完全一致地跑起来」这一既定原则一致。
      RATE_LIMIT_BACKEND: memory
      CIRCUIT_BREAKER_BACKEND: memory
      QUOTA_BACKEND: memory
      SESSION_BACKEND: memory
      OLLAMA_ENABLED: "false"
      # 仅用于 CI，不是任何环境的真实密钥；validate_production_settings()
      # 只在 APP_ENV=production 时校验，这里显式给一个合规长度值以免将来加固后被拦。
      JWT_SECRET: ci_only_secret_at_least_32_characters_long

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"          # 与 docker/backend/Dockerfile 保持一致

      - name: 缓存 pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 3.11 语法闸门
        run: python -m compileall -q app scripts

      - name: 跑测试（含覆盖率门禁）
        # 用 `python -m` 而不是裸 `pytest`：两者 sys.path[0] 不同，裸 pytest
        # 找不到 app 包。pytest.ini 的 pythonpath 已兜底，这里再对齐本地命令。
        #
        # 覆盖率门禁（W-9）：--cov=app **只统计源码**，不把 tests/ 算进来。
        # 阈值以 **CI 这个平台**的实测值为基准，不用本地值：
        #   本地（Windows）TOTAL 7185 语句 / 1376 未覆盖 → 80.85%
        #   CI  （Ubuntu） TOTAL 7243 语句 / 1562 未覆盖 → 78.43%
        # 同一份代码差 58 语句 / 2.42 个百分点（POSIX-only 分支、按平台 skip 的
        # 用例），所以拿本地值设阈值必然偏松，且"本地量过就能过"是假的。
        # 78.43 向下取整 = 78，再减去实测的跨平台漂移 2.4 → 76。
        # 留这段余量不是放水：卡到 78 会让门禁时红时绿，最后人都学会忽略它，
        # 那比没有门禁更糟。
        run: |
          python -m pytest -q \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=76

  frontend:
    name: 前端（类型 / 消毒 / 构建）
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          # 对齐本地开发环境（v22）。曾配 20，jsdom@30 依赖的 undici 在 Node 20
          # 上加载失败 → `XSS 消毒验证` 红，而本地跑不出来（本地就是 22）。
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      # --skipLibCheck：element-plus 的 .d.ts 与 TS 5.x 有已知不兼容告警，
      # 不跳过第三方声明会把 CI 钉死在一堆库告警上，反而看不见自己的错。
      # 代价是库的类型不被校验 —— 换取"自研代码一旦类型不符即红"。
      - name: 类型检查
        run: npm run typecheck

      - name: XSS 消毒验证
        run: npm run check:xss

      - name: 生产构建
        run: npm run build
