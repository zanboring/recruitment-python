name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: 测试（Python 3.11）
    runs-on: ubuntu-latest

    env:
      # CI 里没有 Redis / Ollama / 浏览器。四项后端显式用进程内实现，
      # 与「不配置 Redis 时项目必须与改造前完全一致地跑起来」这一既定原则一致。
      RATE_LIMIT_BACKEND: memory
      CIRCUIT_BREAKER_BACKEND: memory
      QUOTA_BACKEND: memory
      SESSION_BACKEND: memory
      OLLAMA_ENABLED: "false"
      # 仅用于 CI，不是任何环境的真实密钥；validate_production_settings()
      # 只在 APP_ENV=production 时校验，这里显式给一个合规长度值以免将来加固后被拦。
      JWT_SECRET: ci_only_secret_at_least_32_characters_long

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"          # 与 docker/backend/Dockerfile 保持一致

      - name: 缓存 pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 3.11 语法闸门
        run: python -m compileall -q app scripts

      - name: 跑测试
        run: pytest -q
