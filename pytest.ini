[pytest]
testpaths = tests
python_files = test_*.py
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -q
# 关于「漏 await」的守卫：这里**故意不放** filterwarnings 规则。
# 曾试过把「coroutine ... was never awaited」升级为失败，实测两种写法都无效 ——
# 这类协程在对象被 GC 回收时才暴露，pytest 会重新包装成
# PytestUnraisableExceptionWarning，此时警告过滤器已不生效
#（连 -W error::pytest.PytestUnraisableExceptionWarning 也拦不住：
# 人造悬空协程的用例依然显示 "1 passed"）。
# 有效防线是功能断言：tests/test_knowledge_cache_invalidation.py 直接断言
# 「缓存确实被清掉」，去掉 await 就会失败。
filterwarnings =
    ignore::DeprecationWarning
